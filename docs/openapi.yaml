openapi: 3.0.3
info:
  title: Real Estate Service API
  description: >
    Governed REST API providing MCP tools for the real estate platform.
    Enables AI agents to search and manage property listings, handle client lead inquiries,
    manage saved favorites, access agent dashboards, and perform administrative operations.
    All operations are authenticated via user JWT Bearer token forwarded by LockMCP.
  version: 1.0.0

servers:
  - url: https://realestateairc.onrender.com
    description: Production

security:
  - bearerAuth: []

tags:
  - name: properties
    description: Property listings search and management
  - name: inquiries
    description: Client inquiries and lead lifecycle management
  - name: favorites
    description: Client saved property bookmarks (ROLE_CLIENT)
  - name: agent
    description: Agent performance analytics and lead management (ROLE_AGENT)
  - name: admin
    description: User administration and company-wide lead routing (ROLE_ADMIN)

paths:
  # ============================================================================
  # PROPERTIES (Marketplace & Listing Management)
  # ============================================================================
  /api/properties:
    get:
      tags: [properties]
      operationId: listProperties
      summary: List and search real estate properties
      description: >
        Search and filter properties by location, type, price range, bedrooms, bathrooms, and title keywords.
        Returns a paginated list with total count and agent details.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: search
          in: query
          description: Keyword search term matched against property titles (case-insensitive).
          schema:
            type: string
            example: "Modern Loft"
        - name: city
          in: query
          description: Filter properties by city name.
          schema:
            type: string
            example: "New York"
        - name: state
          in: query
          description: Filter properties by state code or name.
          schema:
            type: string
            example: "NY"
        - name: type
          in: query
          description: Property classification.
          schema:
            $ref: '#/components/schemas/PropertyType'
        - name: status
          in: query
          description: Listing availability status.
          schema:
            $ref: '#/components/schemas/PropertyStatus'
        - name: minPrice
          in: query
          description: Minimum price filter in USD.
          schema:
            type: number
            minimum: 0
            example: 250000
        - name: maxPrice
          in: query
          description: Maximum price filter in USD.
          schema:
            type: number
            minimum: 0
            example: 1000000
        - name: bedrooms
          in: query
          description: Minimum number of bedrooms.
          schema:
            type: integer
            minimum: 0
            example: 2
        - name: bathrooms
          in: query
          description: Minimum number of bathrooms.
          schema:
            type: number
            minimum: 0
            example: 2
      responses:
        '200':
          description: Paginated properties list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Property'
                  pagination:
                    $ref: '#/components/schemas/Pagination'

    post:
      tags: [properties]
      operationId: createProperty
      summary: Create a new property listing
      description: >
        Publishes a new real estate property listing assigned to the authenticated agent or admin.
        Requires `ROLE_AGENT` or `ROLE_ADMIN`. Prices are in USD; area is in sqft.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePropertyInput'
      responses:
        '201':
          description: Property created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Property'

  /api/properties/{id}:
    get:
      tags: [properties]
      operationId: getProperty
      summary: Get property details by ID
      description: Returns complete specifications, pricing, amenities, images, and listing agent contact for a property.
      parameters:
        - $ref: '#/components/parameters/PropertyId'
      responses:
        '200':
          description: Property details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Property'
        '404':
          description: Property not found

    put:
      tags: [properties]
      operationId: updateProperty
      summary: Update a property listing by ID
      description: >
        Updates property attributes (price, status, description, amenities).
        Agents can only update their own listings; Administrators can update any listing.
      parameters:
        - $ref: '#/components/parameters/PropertyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePropertyInput'
      responses:
        '200':
          description: Property updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Property'
        '403':
          description: Unauthorized to modify this listing
        '404':
          description: Property not found

    delete:
      tags: [properties]
      operationId: deleteProperty
      summary: Delete a property listing by ID
      description: >
        Permanently deletes a property listing. Agents can only delete listings they own;
        Administrators can delete any listing.
      parameters:
        - $ref: '#/components/parameters/PropertyId'
      responses:
        '200':
          description: Property deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    example: "Property deleted successfully"
        '403':
          description: Unauthorized to delete this listing
        '404':
          description: Property not found

  # ============================================================================
  # INQUIRIES (Client Inquiries & Lead Pipeline)
  # ============================================================================
  /api/inquiries:
    post:
      tags: [inquiries]
      operationId: createInquiry
      summary: Submit an inquiry for a property
      description: >
        Submits a client inquiry/message for a specific property.
        The lead is automatically assigned to the listing agent of that property. Requires `ROLE_CLIENT`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInquiryInput'
      responses:
        '201':
          description: Inquiry submitted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Inquiry'
        '404':
          description: Property not found

    get:
      tags: [admin]
      operationId: listAllInquiries
      summary: List all inquiries system-wide (Admin)
      description: Returns a paginated list of all inquiries across the company with client, property, and assigned agent data. Requires `ROLE_ADMIN`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          description: Filter inquiries by lifecycle status.
          schema:
            $ref: '#/components/schemas/InquiryStatus'
      responses:
        '200':
          description: Inquiries list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Inquiry'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '403':
          description: Admin access required

  /api/inquiries/my:
    get:
      tags: [inquiries]
      operationId: listMyInquiries
      summary: List inquiries submitted by current client
      description: Returns a paginated list of inquiries submitted by the authenticated client. Requires `ROLE_CLIENT`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Client inquiries list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Inquiry'
                  pagination:
                    $ref: '#/components/schemas/Pagination'

  /api/inquiries/{id}:
    get:
      tags: [inquiries]
      operationId: getInquiry
      summary: Get inquiry details by ID
      description: Returns details of a specific inquiry. Accessible by the owning client, assigned agent, or an administrator.
      parameters:
        - $ref: '#/components/parameters/InquiryId'
      responses:
        '200':
          description: Inquiry details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Inquiry'
        '403':
          description: Unauthorized to view this inquiry
        '404':
          description: Inquiry not found

  /api/inquiries/{id}/assign:
    put:
      tags: [admin]
      operationId: assignInquiry
      summary: Assign an inquiry to an agent (Admin)
      description: Assigns or reassigns a lead inquiry to a designated agent by user ID. Requires `ROLE_ADMIN`.
      parameters:
        - $ref: '#/components/parameters/InquiryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agentId]
              properties:
                agentId:
                  type: string
                  format: uuid
                  description: UUID of the agent to assign this lead to.
                  x-mcp-inject: "agentIds"
                  example: "2b7bef21-85c8-4714-842d-018c24da4665"
      responses:
        '200':
          description: Inquiry assigned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Inquiry'
        '400':
          description: Target user is not an agent
        '403':
          description: Admin access required
        '404':
          description: Inquiry not found

  /api/inquiries/{id}/status:
    put:
      tags: [inquiries]
      operationId: updateInquiryStatus
      summary: Update inquiry lifecycle status
      description: Updates the status of an inquiry (`NEW`, `CONTACTED`, `IN_PROGRESS`, `CLOSED`). Accessible by assigned agent or administrator.
      parameters:
        - $ref: '#/components/parameters/InquiryId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: '#/components/schemas/InquiryStatus'
      responses:
        '200':
          description: Status updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Inquiry'
        '403':
          description: Unauthorized to update this inquiry
        '404':
          description: Inquiry not found

  # ============================================================================
  # FAVORITES (Client Saved Bookmarks)
  # ============================================================================
  /api/favorites:
    get:
      tags: [favorites]
      operationId: listFavorites
      summary: List saved favorite properties
      description: Returns all properties bookmarked by the authenticated client. Requires `ROLE_CLIENT`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Saved favorites list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Favorite'
                  pagination:
                    $ref: '#/components/schemas/Pagination'

    post:
      tags: [favorites]
      operationId: addFavorite
      summary: Save a property to favorites
      description: Bookmarks a property for the authenticated client. Returns 409 if already saved. Requires `ROLE_CLIENT`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [propertyId]
              properties:
                propertyId:
                  type: string
                  format: uuid
                  description: UUID of the property to bookmark.
                  x-mcp-inject: "propertyIds"
                  example: "987e6543-e21b-12d3-a456-426614174000"
      responses:
        '201':
          description: Property bookmarked
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Favorite'
        '409':
          description: Already in favorites

  /api/favorites/{propertyId}:
    delete:
      tags: [favorites]
      operationId: removeFavorite
      summary: Remove a property from favorites
      description: Removes a saved property bookmark for the authenticated client. Requires `ROLE_CLIENT`.
      parameters:
        - name: propertyId
          in: path
          required: true
          description: UUID of the property to remove from favorites.
          schema:
            type: string
            format: uuid
            x-mcp-inject: "propertyIds"
            example: "987e6543-e21b-12d3-a456-426614174000"
      responses:
        '200':
          description: Removed from favorites successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    nullable: true
                    example: null
        '404':
          description: Favorite not found

  # ============================================================================
  # AGENT DASHBOARD (Metrics & Assigned Leads)
  # ============================================================================
  /api/agent/dashboard:
    get:
      tags: [agent]
      operationId: getAgentDashboard
      summary: Get agent performance metrics
      description: Returns aggregate counts of total listings, active listings, total leads, and new uncontacted leads. Requires `ROLE_AGENT`.
      responses:
        '200':
          description: Agent dashboard metrics
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      totalListings:
                        type: integer
                        example: 5
                      totalLeads:
                        type: integer
                        example: 12
                      newLeads:
                        type: integer
                        example: 3
                      activeListings:
                        type: integer
                        example: 4
        '403':
          description: Agent access required

  /api/agent/listings:
    get:
      tags: [agent]
      operationId: listAgentListings
      summary: List properties managed by the agent
      description: Returns a paginated list of properties listed by the agent, including real-time inquiry and favorite counters. Requires `ROLE_AGENT`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Managed listings list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Property'
                        - type: object
                          properties:
                            _count:
                              type: object
                              properties:
                                inquiries:
                                  type: integer
                                  example: 4
                                favorites:
                                  type: integer
                                  example: 7
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '403':
          description: Agent access required

  /api/agent/leads:
    get:
      tags: [agent]
      operationId: listAgentLeads
      summary: List client leads assigned to the agent
      description: Returns all inquiries assigned to the authenticated agent with client contact details (email, phone). Requires `ROLE_AGENT`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Assigned leads list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Inquiry'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '403':
          description: Agent access required

  # ============================================================================
  # ADMIN USER MANAGEMENT
  # ============================================================================
  /api/users:
    get:
      tags: [admin]
      operationId: listUsers
      summary: List all registered users (Admin)
      description: Returns a paginated list of all system users with their roles and profile information. Requires `ROLE_ADMIN`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Users list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '403':
          description: Admin access required

  /api/users/{id}:
    get:
      tags: [admin]
      operationId: getUser
      summary: Get user details by ID (Admin)
      description: Returns profile details for a specific user. Requires `ROLE_ADMIN`.
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User profile details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/User'
        '403':
          description: Admin access required
        '404':
          description: User not found

    put:
      tags: [admin]
      operationId: updateUser
      summary: Update user profile or role (Admin)
      description: Updates a user's contact information or changes their role (`ADMIN`, `AGENT`, `CLIENT`). Requires `ROLE_ADMIN`.
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                  example: "Sobit"
                lastName:
                  type: string
                  example: "Admin"
                phone:
                  type: string
                  example: "555-0100"
                role:
                  $ref: '#/components/schemas/Role'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/User'
        '403':
          description: Admin access required
        '404':
          description: User not found

    delete:
      tags: [admin]
      operationId: deleteUser
      summary: Delete a user account (Admin)
      description: Permanently deletes a user account. Requires `ROLE_ADMIN`.
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    example: "User deleted successfully"
        '403':
          description: Admin access required
        '404':
          description: User not found

# ============================================================================
# REUSABLE COMPONENTS
# ============================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Bearer token forwarded automatically by LockMCP on behalf of the authenticated user.

  parameters:
    Page:
      name: page
      in: query
      description: Page number for pagination (starts at 1).
      schema:
        type: integer
        default: 1
        minimum: 1
        example: 1

    Limit:
      name: limit
      in: query
      description: Number of records per page.
      schema:
        type: integer
        default: 10
        minimum: 1
        maximum: 100
        example: 10

    PropertyId:
      name: id
      in: path
      required: true
      description: Property UUID identifier. LockMCP dynamically injects user-accessible property IDs.
      schema:
        type: string
        format: uuid
        x-mcp-inject: "propertyIds"
        example: "987e6543-e21b-12d3-a456-426614174000"

    InquiryId:
      name: id
      in: path
      required: true
      description: Inquiry UUID identifier. LockMCP dynamically injects user-accessible inquiry IDs.
      schema:
        type: string
        format: uuid
        x-mcp-inject: "inquiryIds"
        example: "456e6543-e21b-12d3-a456-426614174000"

    UserId:
      name: id
      in: path
      required: true
      description: User UUID identifier. LockMCP dynamically injects user IDs.
      schema:
        type: string
        format: uuid
        x-mcp-inject: "userIds"
        example: "0e5fdbe2-35ff-4588-b14c-98fb56153f5e"

  schemas:
    Role:
      type: string
      enum: [ADMIN, AGENT, CLIENT]
      example: AGENT

    PropertyType:
      type: string
      enum: [HOUSE, APARTMENT, CONDO, TOWNHOUSE, LAND, COMMERCIAL]
      example: APARTMENT

    PropertyStatus:
      type: string
      enum: [AVAILABLE, SOLD, PENDING, RENTED]
      example: AVAILABLE

    InquiryStatus:
      type: string
      enum: [NEW, CONTACTED, IN_PROGRESS, CLOSED]
      example: NEW

    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        total:
          type: integer
          example: 25
        pages:
          type: integer
          example: 3

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "0e5fdbe2-35ff-4588-b14c-98fb56153f5e"
        email:
          type: string
          format: email
          example: "sobittest@gmail.com"
        firstName:
          type: string
          example: "Sobit"
        lastName:
          type: string
          example: "Admin"
        phone:
          type: string
          nullable: true
          example: "555-0100"
        role:
          $ref: '#/components/schemas/Role'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Property:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "987e6543-e21b-12d3-a456-426614174000"
        title:
          type: string
          example: "Modern Downtown Loft"
        description:
          type: string
          example: "Stunning open-concept loft with floor-to-ceiling windows."
        type:
          $ref: '#/components/schemas/PropertyType'
        status:
          $ref: '#/components/schemas/PropertyStatus'
        price:
          type: number
          description: Price in USD.
          example: 425000
        area:
          type: number
          description: Area in sqft.
          example: 1200
        bedrooms:
          type: integer
          example: 2
        bathrooms:
          type: number
          example: 2
        address:
          type: string
          example: "350 5th Avenue, Apt 12B"
        city:
          type: string
          example: "New York"
        state:
          type: string
          example: "NY"
        zipCode:
          type: string
          example: "10118"
        images:
          type: array
          items:
            type: string
          example: ["https://images.unsplash.com/photo-1502672260266-1c1ef2d93688?w=800"]
        amenities:
          type: array
          items:
            type: string
          example: ["Doorman", "Gym", "Rooftop Deck"]
        yearBuilt:
          type: integer
          nullable: true
          example: 2019
        agentId:
          type: string
          format: uuid
          example: "2b7bef21-85c8-4714-842d-018c24da4665"
        agent:
          type: object
          properties:
            id:
              type: string
              format: uuid
            firstName:
              type: string
            lastName:
              type: string
            email:
              type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Inquiry:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "456e6543-e21b-12d3-a456-426614174000"
        message:
          type: string
          example: "I am interested in this property. Could you schedule a viewing?"
        status:
          $ref: '#/components/schemas/InquiryStatus'
        clientId:
          type: string
          format: uuid
        propertyId:
          type: string
          format: uuid
        agentId:
          type: string
          format: uuid
          nullable: true
        client:
          $ref: '#/components/schemas/User'
        property:
          $ref: '#/components/schemas/Property'
        agent:
          $ref: '#/components/schemas/User'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Favorite:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: "789e6543-e21b-12d3-a456-426614174000"
        userId:
          type: string
          format: uuid
        propertyId:
          type: string
          format: uuid
        property:
          $ref: '#/components/schemas/Property'
        createdAt:
          type: string
          format: date-time

    CreatePropertyInput:
      type: object
      required: [title, type, price, area, bedrooms, bathrooms, address, city, state, zipCode]
      properties:
        title:
          type: string
          example: "Modern Downtown Loft"
        description:
          type: string
          example: "Stunning open-concept loft in the heart of downtown."
        type:
          $ref: '#/components/schemas/PropertyType'
        status:
          $ref: '#/components/schemas/PropertyStatus'
          default: AVAILABLE
        price:
