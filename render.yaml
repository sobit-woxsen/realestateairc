services:
  - type: web
    name: real-estate-api
    env: node
    buildCommand: "npm install && npx prisma generate && npx prisma migrate deploy"
    startCommand: "node src/server.js"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: real-estate-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: LOCKMCP_ISSUER
        sync: false

databases:
  - name: real-estate-db
    plan: free
    engine: postgresql
